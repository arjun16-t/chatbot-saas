[project]
name = "chatbot-saas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arjun Tomar", email = "arjun16tomar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.0",
    "django==6.0.6",
    "django-celery-beat==2.9.0",
    "django-cors-headers==4.9.0",
    "django-redis==7.0.0",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "psycopg2-binary>=2.9.12",
    "python-decouple==3.8",
    "groq==1.4.0",
    "fastembed==0.8.0",
    "langchain-text-splitters==1.1.2",
    "pymupdf4llm==1.27.2.3",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "qdrant-client==1.18.0",
    "sentence-transformers==5.5.1",
    "peft==0.19.1",
    "celery==5.6.3",
    "pillow==12.2.0",
    "gunicorn==26.2.0",
    "torch>=2.13",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]
