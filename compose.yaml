services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis-data:/data

  migrations:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    command: ["sh", "-c", "python backend/manage.py migrate && python backend/manage.py collectstatic --noinput"]
    depends_on:
      db:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    env_file:
      - .env
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=1"]
    volumes:
      - media-data:/app/backend/media/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
  
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    env_file:
      - .env
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - media-data:/app/backend/media/
      - static-data:/app/backend/staticfiles/

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      - static-data:/srv/static/
    depends_on:
      - backend

volumes:
  pg-data:
  redis-data:
  media-data:
  caddy-data:
  caddy-config:
  static-data: