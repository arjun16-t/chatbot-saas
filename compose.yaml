services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis-data:/data

  migrations:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    command: ["python", "backend/manage.py", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    env_file:
      - .env
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    volumes:
      - media-data:/app/media/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
  
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    env_file:
      - .env
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      qdrant:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    volumes:
      - media-data:/app/media/

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  pg-data:
  qdrant-data:
  redis-data:
  media-data: